[package]
name = "revolver"
version = "0.2.3"
edition = "2021"
publish = false
description = "Native zshrs plugin porting revolver (progress spinner)"
authors = ["MenkeTechnologies"]
repository = "https://github.com/MenkeTechnologies/zshrs-revolver"
homepage = "https://github.com/MenkeTechnologies/zshrs-revolver"

[lib]
# rlib alongside cdylib so `cargo test` can link the frame-table checks;
# zpm still loads the cdylib artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
znative = "0.12"
libc = "0.2"
