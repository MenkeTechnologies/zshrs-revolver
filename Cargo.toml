[package]
name = "revolver"
version = "0.2.0"
edition = "2021"
publish = false
description = "revolver (progress spinner) ported to a native zshrs plugin"

[lib]
# rlib alongside cdylib so `cargo test` can link the frame-table checks;
# zpm still loads the cdylib artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
zshrs-plugin = { git = "https://github.com/MenkeTechnologies/zshrs" }
libc = "0.2"
